server:
   port: 8080
spring:
  application:
    name: api-gateway 
  cloud:
    gateway:
      routes:
        - id: agent-service-route
          uri: lb://AGENT-SERVICE
          predicates:
            - Path=/api/agents/**
          filters:
            - StripPrefix=1

        - id: call-routing-service-route
          uri: lb://CALL-ROUTING-SERVICE
          predicates:
            - Path=/api/calls/**
          filters:
            - StripPrefix=1
  eureka:
     client:
        service-url:
            defaultZone: http://localhost:8761/eureka